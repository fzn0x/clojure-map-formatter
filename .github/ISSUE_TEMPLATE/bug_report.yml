name: Bug report
description: Something formats, minifies or validates incorrectly, or the page misbehaves.
labels: [bug]
body:
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The smallest EDN (or JSON) that shows the problem. Please remove anything private.
      render: clojure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste the output or the error message. A screenshot helps for visual problems.
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Settings
      description: Beautify or Minify, and any options you changed (Align, Nested, Indent, Width, Sort).
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 131 on macOS 15
